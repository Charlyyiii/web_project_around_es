<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alrededor de los Estados Unidos</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>

  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./images/logo.svg"
          alt="Logo de Around The U.S."
          class="header__logo"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="Foto de perfil de Jacques Cousteau"
            class="profile__image"
          />

          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <p class="profile__description">Explorador</p>

            <button
              class="profile__edit-button"
              type="button"
              aria-label="Editar perfil"
            ></button>
          </div>

          <button
            class="profile__add-button"
            type="button"
            aria-label="Agregar tarjeta"
          ></button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>

        <template id="card-template">
          <li class="card">
            <img src="" alt="" class="card__image" />

            <button
              class="card__delete-button"
              type="button"
              aria-label="Eliminar tarjeta"
            ></button>

            <div class="card__description">
              <h2 class="card__title"></h2>

              <button
                class="card__like-button"
                type="button"
                aria-label="Me gusta"
              ></button>
            </div>
          </li>
        </template>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Around The U.S.</p>
      </footer>

      <!-- Modal para editar el perfil -->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            class="popup__close"
            type="button"
            aria-label="Cerrar ventana"
          ></button>

          <h2 class="popup__title">Editar perfil</h2>

          <form class="popup__form" id="profile-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_name"
                type="text"
                id="profile-name"
                name="profileName"
                placeholder="Nombre"
                autocomplete="name"
                minlength="2"
                maxlength="40"
                required
              />
              <span class="popup__error" id="profile-name-error"></span>
            </label>

            <label class="popup__field">
              <input
                class="popup__input popup__input_type_description"
                type="text"
                id="profile-description"
                name="profileDescription"
                placeholder="Descripción"
                autocomplete="organization-title"
                minlength="2"
                maxlength="200"
                required
              />
              <span class="popup__error" id="profile-description-error"></span>
            </label>

            <button class="popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <!-- Modal para agregar tarjetas -->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            class="popup__close"
            type="button"
            aria-label="Cerrar ventana"
          ></button>

          <h2 class="popup__title">Nuevo lugar</h2>

          <form class="popup__form" id="new-card-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_card-name"
                type="text"
                id="card-name"
                name="cardName"
                placeholder="Título"
                autocomplete="off"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="popup__error" id="card-name-error"></span>
            </label>

            <label class="popup__field">
              <input
                class="popup__input popup__input_type_url"
                type="url"
                id="card-image-url"
                name="cardImageUrl"
                placeholder="Enlace a la imagen"
                autocomplete="url"
                required
              />
              <span class="popup__error" id="card-image-url-error"></span>
            </label>

            <button class="popup__button" type="submit">Crear</button>
          </form>
        </div>
      </div>

      <!-- Modal para visualizar imágenes -->
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            class="popup__close"
            type="button"
            aria-label="Cerrar imagen"
          ></button>

          <img class="popup__image" src="" alt="" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./public/index.js"></script>
  </body>
</html>
